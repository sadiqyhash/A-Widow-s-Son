<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>A Widow’s Son — AR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}

/* ---------- Landing page ---------- */
#landing{
  position:fixed;inset:0;z-index:50;display:flex;justify-content:center;
  transition:opacity .45s ease;
  background:#000;color:#fff;overflow:hidden;
  padding:clamp(32px,6vh,72px) 22px calc(32px + env(safe-area-inset-bottom));
  box-sizing:border-box;
}
#landingCopy{width:min(100%,780px);height:100%;display:flex;flex-direction:column;align-items:center;text-align:center}
#landing.is-exiting{opacity:0;pointer-events:none}
.landingTitle{margin:0;font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(36px,5.5vw,62px);line-height:1;letter-spacing:-.03em}
#landingImageWrap{width:min(78vw,400px);margin-top:clamp(28px,5vh,56px);flex:0 0 auto}
#landingImage{display:block;width:100%;height:auto}
.landingInstruction{margin:clamp(30px,5vh,50px) auto 0;max-width:600px;font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(18px,2.4vw,25px);line-height:1.25;letter-spacing:-.01em}
#enterAR{appearance:none;border:1px solid rgba(255,255,255,.8);background:transparent;color:#fff;min-width:150px;padding:14px 28px;margin-top:clamp(26px,4vh,40px);font:400 12px/1 Arial,Helvetica,sans-serif;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;transition:background .2s ease,color .2s ease,transform .15s ease}
#enterAR:hover{background:#fff;color:#000}#enterAR:active{transform:translateY(1px)}#enterAR:disabled{opacity:.6;cursor:wait}
@media (max-width:760px){
  #landing{padding-left:18px;padding-right:18px}
  #landingImageWrap{width:min(76vw,340px);margin-top:25px}
  .landingInstruction{margin-top:27px;font-size:20px;max-width:360px}
  #enterAR{margin-top:25px}
}

/* ---------- AR stage ---------- */
#arStage{position:fixed;inset:0;overflow:hidden;z-index:1;background:#000}
#arStage video{position:absolute!important;pointer-events:none!important;z-index:0!important}
#scene{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;z-index:1!important}
canvas.a-canvas{background:transparent!important;pointer-events:none!important}
#status{position:fixed;left:0;right:0;bottom:18px;z-index:15;color:#fff;text-align:center;font:14px Arial,sans-serif;text-shadow:0 1px 5px #000;pointer-events:none;opacity:0;transition:opacity .35s ease}
#status.is-visible{opacity:1}

#debug{display:none;position:fixed;top:12px;left:12px;right:12px;z-index:30;background:rgba(0,0,0,.80);color:#fff;padding:12px;font:12px Arial,sans-serif;border-radius:6px;box-sizing:border-box;backdrop-filter:blur(4px)}
#debug input[type=range]{width:100%}
#debug label{display:block;margin-top:9px}
body.debug #debug{display:block}
</style>
</head>
<body>
<section id="landing" aria-label="A Widow’s Son AR landing page">
  <div id="landingCopy">
    <h1 class="landingTitle">A Widow’s Son</h1>
    <div id="landingImageWrap">
      <img id="landingImage" src="./assets/landing.png" alt="Artwork from A Widow’s Son">
    </div>
    <p class="landingInstruction">Point your camera at the artwork to reveal what is hidden.</p>
    <button id="enterAR" disabled>Enter</button>
    <div id="cameraError" aria-live="polite" style="display:none;margin-top:14px;font:12px Arial,Helvetica,sans-serif;letter-spacing:.02em;opacity:.75;max-width:320px">Camera access was not available. Please allow camera access and try again.</div>
  </div>
</section>

<div id="arStage">
  <a-scene id="scene" embedded
    mindar-image="imageTargetSrc:./targets/targets.mind;autoStart:false;uiLoading:no;uiError:no;uiScanning:no;maxTrack:1;warmupTolerance:6;missTolerance:3;filterMinCF:0.0005;filterBeta:1000;"
    renderer="alpha:true;antialias:true;colorManagement:true;physicallyCorrectLights:false"
    vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">

    <a-assets>
      <img id="letters01" src="./assets/letters/work-01-letters.png">
      <img id="letters02" src="./assets/letters/work-02-letters.png">
      <img id="letters03" src="./assets/letters/work-03-letters.png">
      <img id="letters04" src="./assets/letters/work-04-letters.png">
      <img id="letters05" src="./assets/letters/work-05-letters.png">
      <img id="letters06" src="./assets/letters/work-06-letters.png">
      <img id="letters07" src="./assets/letters/work-07-letters.png">
      <img id="letters08" src="./assets/letters/work-08-letters.png">

      <img id="ref01" src="./assets/targets/work-01.jpg">
      <img id="ref02" src="./assets/targets/work-02.jpg">
      <img id="ref03" src="./assets/targets/work-03.jpg">
      <img id="ref04" src="./assets/targets/work-04.jpg">
      <img id="ref05" src="./assets/targets/work-05.jpg">
      <img id="ref06" src="./assets/targets/work-06.jpg">
      <img id="ref07" src="./assets/targets/work-07.jpg">
      <img id="ref08" src="./assets/targets/work-08.jpg">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <!-- The supplied targets.mind is reverse-ordered: 0→08, 1→07, ... 7→01. -->
    <a-entity class="target" data-index="0" data-work="08" mindar-image-target="targetIndex:0">
      <a-plane class="reference" width="1" height="1" position="0 0 -0.002" rotation="0 0 0"></a-plane>
      <a-plane class="solution" width="1" height="1" position="0 0 0" rotation="0 0 0" material="shader:flat;transparent:true;alphaTest:0.001;depthWrite:false;opacity:1"></a-plane>
      <a-plane class="debug-border" width="1" height="1" position="0 0 0.001" material="shader:flat;wireframe:true;wireframeLinewidth:2;color:#ffffff;transparent:true;opacity:0"></a-plane>
    </a-entity>
    <a-entity class="target" data-index="1" data-work="07" mindar-image-target="targetIndex:1">
      <a-plane class="reference" width="1" height="1" position="0 0 -0.002" rotation="0 0 0"></a-plane>
      <a-plane class="solution" width="1" height="1" position="0 0 0" rotation="0 0 0" material="shader:flat;transparent:true;alphaTest:0.001;depthWrite:false;opacity:1"></a-plane>
      <a-plane class="debug-border" width="1" height="1" position="0 0 0.001" material="shader:flat;wireframe:true;wireframeLinewidth:2;color:#ffffff;transparent:true;opacity:0"></a-plane>
    </a-entity>
    <a-entity class="target" data-index="2" data-work="06" mindar-image-target="targetIndex:2">
      <a-plane class="reference" width="1" height="1" position="0 0 -0.002" rotation="0 0 0"></a-plane>
      <a-plane class="solution" width="1" height="1" position="0 0 0" rotation="0 0 0" material="shader:flat;transparent:true;alphaTest:0.001;depthWrite:false;opacity:1"></a-plane>
      <a-plane class="debug-border" width="1" height="1" position="0 0 0.001" material="shader:flat;wireframe:true;wireframeLinewidth:2;color:#ffffff;transparent:true;opacity:0"></a-plane>
    </a-entity>
    <a-entity class="target" data-index="3" data-work="05" mindar-image-target="targetIndex:3">
      <a-plane class="reference" width="1" height="1" position="0 0 -0.002" rotation="0 0 0"></a-plane>
      <a-plane class="solution" width="1" height="1" position="0 0 0" rotation="0 0 0" material="shader:flat;transparent:true;alphaTest:0.001;depthWrite:false;opacity:1"></a-plane>
      <a-plane class="debug-border" width="1" height="1" position="0 0 0.001" material="shader:flat;wireframe:true;wireframeLinewidth:2;color:#ffffff;transparent:true;opacity:0"></a-plane>
    </a-entity>
    <a-entity class="target" data-index="4" data-work="04" mindar-image-target="targetIndex:4">
      <a-plane class="reference" width="1" height="1" position="0 0 -0.002" rotation="0 0 0"></a-plane>
      <a-plane class="solution" width="1" height="1" position="0 0 0" rotation="0 0 0" material="shader:flat;transparent:true;alphaTest:0.001;depthWrite:false;opacity:1"></a-plane>
      <a-plane class="debug-border" width="1" height="1" position="0 0 0.001" material="shader:flat;wireframe:true;wireframeLinewidth:2;color:#ffffff;transparent:true;opacity:0"></a-plane>
    </a-entity>
    <a-entity class="target" data-index="5" data-work="03" mindar-image-target="targetIndex:5">
      <a-plane class="reference" width="1" height="1" position="0 0 -0.002" rotation="0 0 0"></a-plane>
      <a-plane class="solution" width="1" height="1" position="0 0 0" rotation="0 0 0" material="shader:flat;transparent:true;alphaTest:0.001;depthWrite:false;opacity:1"></a-plane>
      <a-plane class="debug-border" width="1" height="1" position="0 0 0.001" material="shader:flat;wireframe:true;wireframeLinewidth:2;color:#ffffff;transparent:true;opacity:0"></a-plane>
    </a-entity>
    <a-entity class="target" data-index="6" data-work="02" mindar-image-target="targetIndex:6">
      <a-plane class="reference" width="1" height="1" position="0 0 -0.002" rotation="0 0 0"></a-plane>
      <a-plane class="solution" width="1" height="1" position="0 0 0" rotation="0 0 0" material="shader:flat;transparent:true;alphaTest:0.001;depthWrite:false;opacity:1"></a-plane>
      <a-plane class="debug-border" width="1" height="1" position="0 0 0.001" material="shader:flat;wireframe:true;wireframeLinewidth:2;color:#ffffff;transparent:true;opacity:0"></a-plane>
    </a-entity>
    <a-entity class="target" data-index="7" data-work="01" mindar-image-target="targetIndex:7">
      <a-plane class="reference" width="1" height="1" position="0 0 -0.002" rotation="0 0 0"></a-plane>
      <a-plane class="solution" width="1" height="1" position="0 0 0" rotation="0 0 0" material="shader:flat;transparent:true;alphaTest:0.001;depthWrite:false;opacity:1"></a-plane>
      <a-plane class="debug-border" width="1" height="1" position="0 0 0.001" material="shader:flat;wireframe:true;wireframeLinewidth:2;color:#ffffff;transparent:true;opacity:0"></a-plane>
    </a-entity>
  </a-scene>
</div>

<div id="status">Ready.</div>
<div id="debug">
  <div id="debugName">No target</div>
  <div style="margin-top:5px;opacity:.8">White square = exact 1:1 AR target boundary.</div>
  <label>Letter opacity <input id="opacity" type="range" min="0" max="1" step="0.01" value="1"></label>
  <label style="display:flex;align-items:center;gap:8px"><input id="referenceToggle" type="checkbox"> Show reference artwork</label>
</div>

<script>
const scene=document.querySelector('#scene');
const landing=document.querySelector('#landing');
const enterAR=document.querySelector('#enterAR');
const status=document.querySelector('#status');
const debugName=document.querySelector('#debugName');
const opacityControl=document.querySelector('#opacity');
const referenceToggle=document.querySelector('#referenceToggle');
const cameraError=document.querySelector('#cameraError');
const targets=[...document.querySelectorAll('.target')];
const targetToWork=[8,7,6,5,4,3,2,1];
const debugMode=new URLSearchParams(location.search).get('debug')==='1';
if(debugMode)document.body.classList.add('debug');
let activeIndex=-1;
let assetsReady=false;

function hideAllTargets(){targets.forEach(el=>{el.object3D.visible=false;});}

function waitImage(img){
  return new Promise(resolve=>{
    if(img.complete && img.naturalWidth>0){resolve();return;}
    img.addEventListener('load',resolve,{once:true});
    img.addEventListener('error',resolve,{once:true});
  });
}

function setupPlanes(){
  targets.forEach((el,i)=>{
    const work=targetToWork[i];
    const solutionPlane=el.querySelector('.solution');
    const referencePlane=el.querySelector('.reference');
    const letters=document.querySelector('#letters'+String(work).padStart(2,'0'));
    const ref=document.querySelector('#ref'+String(work).padStart(2,'0'));

    const mesh=solutionPlane.getObject3D('mesh');
    if(mesh && mesh.material){
      const canvas=document.createElement('canvas');
      canvas.width=4500; canvas.height=4500;
      const texture=new THREE.CanvasTexture(canvas);
      texture.colorSpace=THREE.SRGBColorSpace;
      texture.minFilter=THREE.LinearFilter;
      texture.magFilter=THREE.LinearFilter;
      texture.generateMipmaps=false;
      texture.needsUpdate=true;
      mesh.material.map=texture;
      mesh.material.transparent=true;
      mesh.material.alphaTest=0.001;
      mesh.material.depthWrite=false;
      mesh.material.needsUpdate=true;
      el._reveal={canvas,ctx:canvas.getContext('2d'),texture,source:letters,work,cells:[] ,revealed:0,found:false,timer:null,startTime:0};
    }
    const rmesh=referencePlane.getObject3D('mesh');
    if(rmesh && rmesh.material){
      rmesh.material.map=new THREE.TextureLoader().load(ref.src,()=>{
        rmesh.material.map.colorSpace=THREE.SRGBColorSpace;
        rmesh.material.transparent=true;
        rmesh.material.depthWrite=false;
        rmesh.material.opacity=debugMode && referenceToggle.checked?0.35:0;
        rmesh.material.needsUpdate=true;
      });
      rmesh.material.transparent=true;
      rmesh.material.depthWrite=false;
      rmesh.material.opacity=0;
    }
  });
}

function drawCells(el, upto){
  const r=el._reveal;
  if(!r||!r.ctx||!r.source)return;
  r.ctx.clearRect(0,0,4500,4500);
  const limit=Math.min(upto,r.cells.length);
  for(let n=0;n<limit;n++){
    const [x,y,w,h]=r.cells[n];
    r.ctx.drawImage(r.source,x,y,w,h,x,y,w,h);
  }
  r.texture.needsUpdate=true;
}

function clearReveal(el){
  const r=el._reveal;
  if(!r)return;
  if(r.timer)cancelAnimationFrame(r.timer);
  r.timer=null;
  r.startTime=0;
  r.revealed=0;
  drawCells(el,0);
}

function revealAll(el){
  const r=el._reveal;
  if(!r)return;
  if(r.timer)cancelAnimationFrame(r.timer);
  r.timer=null;
  r.startTime=0;
  r.revealed=r.cells.length;
  drawCells(el,r.cells.length);
}

function showTarget(i){
  targets.forEach((el,idx)=>{
    const same=idx===i;
    el.object3D.visible=same;
    if(!same&&el._reveal){el._reveal.found=false;clearReveal(el);}
  });
  activeIndex=i;
  const work=targetToWork[i];
  const r=targets[i]._reveal;
  if(r){
    r.found=true;
    revealAll(targets[i]);
  }
  debugName.textContent='MINDAR TARGET '+i+' → WORK '+String(work).padStart(2,'0')+' → LETTERS '+String(work).padStart(2,'0');
  status.classList.remove('is-visible');
}

function hideTarget(i){
  if(activeIndex!==i)return;
  const r=targets[i]._reveal;
  if(r){r.found=false;}
  targets[i].object3D.visible=false;
  activeIndex=-1;
  debugName.textContent='No target';
  status.textContent='Point your camera at the artwork.';
  status.classList.add('is-visible');
}

targets.forEach((el,i)=>{
  el.addEventListener('targetFound',()=>showTarget(i));
  el.addEventListener('targetLost',()=>hideTarget(i));
});

scene.addEventListener('loaded',async()=>{
  const imgs=[...document.querySelectorAll('#scene a-assets img')];
  await Promise.all(imgs.map(waitImage));
  setupPlanes();
  const cellData=await fetch('./assets/letters/cells.json',{cache:'no-store'}).then(r=>r.json());
  targets.forEach((el,i)=>{
    const work=targetToWork[i];
    el._reveal.cells=cellData['work-'+String(work).padStart(2,'0')].cells;
    drawCells(el,0);
  });
  assetsReady=true;
  hideAllTargets();
  enterAR.disabled=false;
  status.textContent='Point your camera at the artwork.';
});

scene.addEventListener('arReady',()=>{
  status.textContent='Point your camera at the artwork.';
  status.classList.add('is-visible');
  window.setTimeout(()=>status.classList.remove('is-visible'),3200);
});

opacityControl.addEventListener('input',()=>{
  targets.forEach(el=>{
    const plane=el.querySelector('.solution');
    if(plane){
      const m=plane.getObject3D('mesh')?.material;
      if(m){m.opacity=Number(opacityControl.value);m.needsUpdate=true;}
    }
  });
});

referenceToggle.addEventListener('change',()=>{
  targets.forEach(el=>{
    const m=el.querySelector('.reference')?.getObject3D('mesh')?.material;
    if(m){m.opacity=referenceToggle.checked?0.35:0;m.needsUpdate=true;}
  });
});



enterAR.addEventListener('click',async()=>{
  if(!assetsReady)return;
  try{
    enterAR.disabled=true;
    cameraError.style.display='none';
    landing.classList.add('is-exiting');
    await scene.systems['mindar-image-system'].start();
    window.setTimeout(()=>{
      landing.style.display='none';
      landing.classList.remove('is-exiting');
    },450);
  }catch(e){
    console.error(e);
    landing.classList.remove('is-exiting');
    enterAR.disabled=false;
    cameraError.style.display='block';
  }
});
</script>
</body>
</html>
